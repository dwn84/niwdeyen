  .artwork-wrapper img { display: block; max-width: min(85vw, 540px); height: auto; border-radius: 12px; position: relative; z-index: 1; }

<script>
const gc = document.getElementById('gridCanvas'), gx = gc.getContext('2d');
let gw, gh;
function resizeGrid() { gw = gc.width = innerWidth; gh = gc.height = innerHeight; }
addEventListener('resize', resizeGrid); resizeGrid();
const cx = () => gw/2, cy = () => gh*0.42;
const NUM_H = 50, NUM_V = 36, FAR = 3.0;
let waveRings = [];
setInterval(() => waveRings.push({radius:0,intensity:1,phase:0}), 3500);

function drawGrid(time) {
  gx.clearRect(0,0,gw,gh);
  const vx = cx(), vy = cy();
  for(let i=waveRings.length-1;i>=0;i--){
    const w=waveRings[i]; w.radius+=2.8; w.intensity*=0.995; w.phase+=0.06;
    if(w.intensity<0.02) waveRings.splice(i,1);
  }
  function getWD(y){let d=0;for(const w of waveRings){const da=Math.abs(Math.abs(y-vy)-w.radius);if(da<80)d+=Math.sin(da*0.08+w.phase)*(1-da/80)*w.intensity*35}return d}
  function getWG(y){let g=0;for(const w of waveRings){const da=Math.abs(Math.abs(y-vy)-w.radius);if(da<50)g+=(1-da/50)*w.intensity}return Math.min(g,1)}
  for(let i=0;i<=NUM_H;i++){
    const t=i/NUM_H, y=vy+t*(gh-vy)*FAR;
    if(y>gh+20) continue;
    const sp=t*gw*0.7, df=Math.pow(Math.max(0,(y-vy)/((gh-vy)*FAR)),2);
    const a=Math.min(1,df*0.55), w=Math.max(0.3,t*3);
    const wd=getWD(y), wg=getWG(y);
    const r=Math.round(0+wg*20), gn=Math.round(100+wg*40), b=Math.round(200+wg*55);
    gx.beginPath(); gx.moveTo(vx-sp, y+wd); gx.lineTo(vx+sp, y+wd);
    gx.strokeStyle=`rgba(${r},${gn},${b},${a})`;
    gx.lineWidth=w; gx.shadowBlur=w*5+wg*30;
    gx.shadowColor=`rgba(${r},${gn},${b},${a*0.6})`;
    gx.stroke(); gx.shadowBlur=0;
    if(wg>0.05&&t>0.3){gx.beginPath();gx.moveTo(vx-sp*1.1,y+wd);gx.lineTo(vx+sp*1.1,y+wd);gx.strokeStyle=`rgba(${r},${gn},${b},${wg*0.15})`,gx.lineWidth=w*6,gx.stroke()}
  }
  for(let i=-(NUM_V/2);i<=NUM_V/2;i++){
    gx.beginPath(); let started=false, maxA=0;
    for(let j=0;j<=60;j++){
      const t2=j/60, y=vy+t2*(gh-vy)*FAR;
      if(y<0)continue;
      const sp=t2*gw*0.7, x=vx+(i/(NUM_V/2))*sp, wd=getWD(y), wg=getWG(y);
      const df=Math.pow(Math.max(0,(y-vy)/((gh-vy)*FAR)),2);
      const a=Math.min(0.3,df*0.25+Math.abs(i)/(NUM_V/2)*0.08); maxA=Math.max(maxA,a);
      const r=Math.round(0+wg*20), gn=Math.round(100+wg*40), b=Math.round(200+wg*75);
      if(!started){gx.moveTo(x,y+wd);started=true}else gx.lineTo(x,y+wd)
    }
    gx.strokeStyle=`rgba(200,0,255,${Math.min(maxA,0.25)})`;
    gx.lineWidth=0.8; gx.shadowBlur=6; gx.shadowColor=`rgba(200,0,255,${maxA*0.3})`;
    gx.stroke(); gx.shadowBlur=0;
  }
  for(const w of waveRings){
    const a=w.intensity*0.5;
    gx.beginPath(); gx.arc(vx,vy,w.radius,0,Math.PI*2);
    gx.strokeStyle=`rgba(0,102,255,${a})`;
    gx.lineWidth=w.intensity*6+2; gx.shadowBlur=40;     gx.shadowColor=`rgba(0,102,255,${a*0.8})`;
    gx.stroke(); gx.shadowBlur=0;
    gx.beginPath(); gx.arc(vx,vy,w.radius*0.65,0,Math.PI*2);
    gx.strokeStyle=`rgba(0,136,255,${a*0.4})`;
    gx.lineWidth=w.intensity*3; gx.shadowBlur=25;     gx.shadowColor=`rgba(0,136,255,${a*0.5})`;
    gx.stroke(); gx.shadowBlur=0;
    if(w.radius<800){const g=gx.createRadialGradient(vx,vy,0,vx,vy,w.radius);g.addColorStop(0,`rgba(0,255,255,0)`);g.addColorStop(0.4,`rgba(0,102,255,${a*0.03})`);g.addColorStop(0.7,`rgba(0,136,255,${a*0.04})`);g.addColorStop(1,`rgba(0,255,255,0)`);gx.fillStyle=g;gx.beginPath();gx.arc(vx,vy,w.radius,0,Math.PI*2);gx.fill()}
  }
}
const pc=document.getElementById('particles'),px=pc.getContext('2d');let particles=[],pw,ph;
function resizeParticles(){pw=pc.width=innerWidth;ph=pc.height=innerHeight}
addEventListener('resize',resizeParticles);resizeParticles();
class Particle{
  constructor(){this.reset()}
  reset(){this.x=Math.random()*pw;this.y=Math.random()*ph;this.size=Math.random()*2.5+0.3;this.speedY=-(Math.random()*0.8+0.05);this.speedX=(Math.random()-0.5)*0.2;this.opacity=Math.random()*0.5+0.15;this.color=Math.random()>0.55?[0, 102, 255]:[0, 136, 255];this.life=Math.random()*400+100;this.maxLife=this.life}
  update(){this.x+=this.speedX;this.y+=this.speedY;this.life--;this.opacity=Math.max(0,(this.life/this.maxLife)*0.5);if(this.life<=0||this.y<-10)this.reset()}
  draw(){const[r,g,b]=this.color;px.beginPath();px.arc(this.x,this.y,this.size,0,Math.PI*2);px.fillStyle=`rgba(${r},${g},${b},${this.opacity})`;px.fill();px.shadowBlur=12;px.shadowColor=`rgba(${r},${g},${b},${this.opacity*0.4})`;px.fill();px.shadowBlur=0}
}
for(let i=0;i<150;i++)particles.push(new Particle());
let startTime=performance.now();
function mainLoop(t){drawGrid((t-startTime)/1000);px.clearRect(0,0,pw,ph);for(const p of particles){p.update();p.draw()}requestAnimationFrame(mainLoop)}
requestAnimationFrame(mainLoop);

function typeWriter(el, text, targetColor, neonColors, speed, cb) {
  el.textContent = '';
  let i = 0;
  function step() {
    if (i >= text.length) { if (cb) cb(); return; }
    const ch = text[i];
    if (ch === '\n') {
      el.appendChild(document.createElement('br'));
      i++;
      setTimeout(step, speed);
      return;
    }
    const span = document.createElement('span');
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    const nc = neonColors[i % neonColors.length];
    span.style.transition = 'color 0.6s ease, text-shadow 0.6s ease';
    span.style.color = nc;
    span.style.textShadow = `0 0 10px ${nc}`;
    el.appendChild(span);
    void span.offsetWidth;
    span.style.color = targetColor;
    span.style.textShadow = 'none';
    i++;
    setTimeout(step, speed);
  }
  step();
}

const tagline = document.getElementById('tagline');
const desc = document.getElementById('desc');
const neonTagline = ['#00ffff', '#ff00ff', '#ffff00', '#ffffff', '#00ff88'];
const neonDesc = ['#0066ff', '#00ffff', '#ff00ff', '#ffff44', '#00ff88'];
typeWriter(tagline, tagline.dataset.text, '#0066ff', neonTagline, 22, () => {
  setTimeout(() => typeWriter(desc, desc.dataset.text, 'rgba(255,255,255,0.6)', neonDesc, 9), 500);
});

const tags = document.querySelectorAll('.tag');
tags.forEach(t => {
  function schedule() {
    const delay = 2000 + Math.random() * 6000;
    setTimeout(() => {
      t.classList.add('tag-focus');
      setTimeout(() => {
        t.classList.remove('tag-focus');
        schedule();
      }, 400 + Math.random() * 500);
    }, delay);
  }
  schedule();
});
</script>
